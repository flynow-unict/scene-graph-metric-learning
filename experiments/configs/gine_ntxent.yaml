# Modello principale: GINEConv usa gli embedding NOMIC delle relazioni, quindi
# sfrutta l'informazione relazionale che la baseline scarta. Stessa loss della
# baseline, cosi' la differenza e' attribuibile alla sola architettura.
data: data/sceneGraph/fullset/semantic/embedded/train_scene_graphs.pt
conv: gine
loss: ntxent
positives: mixed
epochs: 300
batch_size: 128
lr: 0.001
temperature: 0.2
dropout: 0.3
pool: mean
min_sim: 0.15
pos_k: 5
sem_veto: 0.55
out: data/models/fullset/checkpoints/gcn_encoder_gine.pth
