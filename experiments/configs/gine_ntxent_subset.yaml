# Stessa configurazione di gine_ntxent.yaml sul corpus ridotto (15k scene),
# per misurare l'effetto della scala del corpus a parita' di tutto il resto.
data: data/sceneGraph/subset/semantic/embedded/train_scene_graphs.pt
conv: gine
loss: ntxent
positives: mixed
epochs: 300
batch_size: 128
lr: 0.001
temperature: 0.2
dropout: 0.3
pool: mean
min_sim: 0.15
pos_k: 5
sem_veto: 0.55
out: data/models/subset/checkpoints/gcn_encoder_gine.pth
