# Grafi senza arricchimento ontologico di Virtuoso (variante "baseline" degli
# scene graph): isola il contributo dell'inferenza semantica.
data: data/sceneGraph/fullset/baseline/embedded/train_scene_graphs.pt
conv: gine
loss: ntxent
positives: mixed
epochs: 300
batch_size: 128
lr: 0.001
temperature: 0.2
dropout: 0.3
pool: mean
min_sim: 0.15
pos_k: 5
sem_veto: 0.55
out: data/models/fullset/checkpoints/baseline_gcn_encoder_gine.pth
